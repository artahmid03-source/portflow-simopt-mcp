name: Collect AIS

# Listens to AISStream for a few minutes every hour and appends what it heard to the `data` branch.
# Needs one repository secret: AISSTREAM_API_KEY (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to listen
        default: "8"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: store
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra ais --locked --no-dev
      - name: Listen
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: uv run --no-dev python ingest/collect.py --store store --minutes "${{ inputs.minutes || '8' }}"
      - name: Save to the data branch
        working-directory: store
        run: |
          git config user.name "portflow-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q
          fi
