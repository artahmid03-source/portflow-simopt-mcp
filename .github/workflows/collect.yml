name: Collect AIS

# Listens to AISStream for 12 minutes and appends what it heard to the `data` branch, together with the Port of
# Hamburg's list of expected ships. Scheduled every 15 minutes; GitHub runs far fewer under load, so the health
# workflow also restarts it when the last run is more than 90 minutes old, and the plans workflow listens before
# planning. For continuous collection run the same script in always-on mode on a server (see deploy/README.md).
# Needs one repository secret: AISSTREAM_API_KEY (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to listen
        default: "12"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: store
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra ais --locked --no-dev
      - name: Listen
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: uv run --no-dev python ingest/collect.py --store store --minutes "${{ inputs.minutes || '12' }}"
      - name: Port of Hamburg expected-vessel list
        continue-on-error: true
        run: uv run --no-dev python ingest/hamburg_expected.py --store store
      - name: Save to the data branch
        if: always()
        run: bash tools/push_store.sh store "collect $(date -u +%Y-%m-%dT%H:%MZ)"
