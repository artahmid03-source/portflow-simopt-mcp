name: Daily update and control-tower plans

# Once a day: fit the tide model to the official Elbe gauges and summarise the collected AIS
# (hamburg/latest.json, hamburg/daily/DATE.json), then plan both ports on today's data with CP-SAT and
# the yard simulation (hamburg/tower.json, chattogram/tower.json), check the in-page engine against
# those plans, and save everything to the `data` branch. The tower pages load the tower files.

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: store
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-dev
      - name: Build the daily update
        run: uv run --no-dev python run_daily.py --store store
      - name: Hamburg control tower
        continue-on-error: true
        run: uv run --no-dev python run_tower.py --site hamburg --store store
      - name: Chattogram control tower
        continue-on-error: true
        run: uv run --no-dev python run_tower.py --site chattogram --store store
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the in-page engine against today's plans
        continue-on-error: true
        run: |
          for s in hamburg chattogram; do
            if [ -f store/$s/tower.json ]; then node web/validate.mjs --data store/$s/tower.json --write; fi
          done
      - name: Save to the data branch
        if: always()
        working-directory: store
        run: |
          git config user.name "portflow-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "daily $(date -u +%Y-%m-%d)"
            git pull -q --rebase
            git push -q
          fi
