name: Control-tower plans (every 4 hours)

# Every 4 hours (03:40, 07:40, ... UTC): listen to AIS for 8 minutes, read the port's expected-vessel list, fit the tide model to the official Elbe gauges and summarise the collected AIS
# (hamburg/latest.json, hamburg/daily/DATE.json), then plan the Port of Hamburg with CP-SAT and the yard simulation
# (hamburg/tower.json), check the in-page engine against that plan, and save everything to the `data` branch.
# The Hamburg control tower page loads the tower file.

on:
  schedule:
    - cron: "40 3,7,11,15,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: store
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra ais --locked --no-dev
      # every input step may fail on its own (a site down, a slow network): the plan then uses the last good copy
      - name: Listen to AIS before planning
        continue-on-error: true
        timeout-minutes: 12
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: uv run --no-dev python ingest/collect.py --store store --minutes 8
      - name: Port of Hamburg expected-vessel list
        continue-on-error: true
        run: uv run --no-dev python ingest/hamburg_expected.py --store store
      - name: Tide and wind forecast, vessel picture
        continue-on-error: true
        run: uv run --no-dev python run_daily.py --store store
      - name: Plan against reality (Hamburg)
        continue-on-error: true
        run: uv run --no-dev python run_backtest.py --store store
      - name: Learned arrival-time model (Hamburg)
        continue-on-error: true
        run: uv run --no-dev python run_eta_model.py --store store
      - name: Hamburg control tower
        continue-on-error: true
        env:
          PORTFLOW_PROCS: "4"
          PORTFLOW_CPSAT_WORKERS: "4"
        run: uv run --no-dev python run_tower.py --site hamburg --store store
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the in-page engine against today's plans
        continue-on-error: true
        run: |
          for s in hamburg; do
            if [ -f store/$s/tower.json ]; then node web/validate.mjs --data store/$s/tower.json --write; fi
            # keep the validated copy as the last plan with ships
            python3 -c "import json,shutil,sys; p='store/$s/tower.json'; d=json.load(open(p)); d.get('status')=='ok' and shutil.copyfile(p,'store/$s/tower_last_ok.json')" || true
          done
      - name: Save to the data branch
        if: always()
        run: bash tools/push_store.sh store "plans $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Wake the planning API so the copilot is quick on the new plans
        if: always()
        continue-on-error: true
        run: |
          sleep 30   # raw.githubusercontent.com caches for a few minutes
          for s in hamburg; do
            curl -s -m 120 -o /dev/null -w "$s %{http_code}\n" -X POST https://portflow-api.onrender.com/plan \
              -H 'Content-Type: application/json' -d "{\"site\":\"$s\",\"scenario\":{}}" || true
          done
